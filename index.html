<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Express Taxi</title>
    <!-- Yandex Xarita API -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff; }

        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* MARKAZIY QIZIL NISHON (PIN) */
        .center-pin-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            z-index: 15;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .center-pin {
            width: 38px;
            height: 38px;
            background: #ff3333;
            border: 3px solid #111;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 12px rgba(255, 51, 51, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .center-pin::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            transform: rotate(45deg);
        }
        .pin-shadow {
            width: 14px;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            margin-top: 2px;
        }

        /* Navigatsiya tugmalari */
        .map-btn {
            position: absolute;
            z-index: 20;
            background: #ffffff;
            border: none;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            cursor: pointer;
            font-size: 20px;
        }
        .btn-menu { top: 18px; left: 18px; }
        .btn-layers { top: 18px; right: 18px; font-size: 18px; }
        .btn-locate { bottom: 220px; right: 18px; font-size: 22px; transition: bottom 0.3s ease; }

        /* 1-EKRAN: SURILUVCHI PASTKI PANEL */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            z-index: 30;
            box-shadow: 0 -6px 30px rgba(0,0,0,0.15);
            padding: 12px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: height 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .bottom-sheet.expanded { height: 82vh; }

        .sheet-handle-bar {
            width: 48px;
            height: 6px;
            background: #dcdde1;
            border-radius: 6px;
            margin: 0 auto 4px auto;
            cursor: pointer;
        }

        .title-text { font-size: 22px; font-weight: 800; color: #111; }

        .search-box {
            display: flex;
            align-items: center;
            background: #f1f2f6;
            border-radius: 16px;
            padding: 14px 16px;
            gap: 12px;
        }
        .search-input {
            border: none;
            background: transparent;
            font-size: 16px;
            color: #111;
            width: 100%;
            outline: none;
        }

        /* 20 KM Qidiruv natijalari */
        .search-results {
            display: none;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: calc(82vh - 230px);
        }
        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #f8f9fa;
            border: 1px solid #ebebeb;
            border-radius: 12px;
            cursor: pointer;
        }
        .result-item:active { background: #e9ecef; }
        .result-title { font-weight: 700; font-size: 14px; color: #222; }
        .result-sub { font-size: 12px; color: #777; }
        .result-dist { font-size: 12px; font-weight: 700; color: #ff3333; }

        /* 2-EKRAN (3-RASM BO'YICHA): SAFAR TAFSILOTLARI */
        .overview-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48vh;
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            z-index: 30;
            box-shadow: 0 -6px 30px rgba(0,0,0,0.15);
            padding: 18px 20px 24px 20px;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }

        .route-points { display: flex; flex-direction: column; gap: 10px; }
        .point-item { display: flex; align-items: center; justify-content: space-between; }
        .point-left { display: flex; align-items: center; gap: 10px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-start { background: #ffcc00; }
        .dot-end { background: #ff3333; }
        .point-name { font-size: 14px; font-weight: 600; color: #222; }

        .btn-note {
            background: #f4f4f6;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
        }

        .tariff-card {
            background: #ffffff;
            border: 1.5px solid #ececec;
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tariff-left { display: flex; align-items: center; gap: 12px; }
        .car-img { width: 48px; height: auto; }
        .tariff-name { font-size: 15px; font-weight: 700; }
        .tariff-seats { font-size: 12px; color: #888; }
        .price-val { font-size: 16px; font-weight: 800; }

        .pricing-row { display: flex; align-items: center; justify-content: space-between; }
        .tip-selector { font-size: 13px; color: #444; font-weight: 600; }
        .total-badge {
            border: 1.5px solid #ffcc00;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            color: #111;
        }

        .btn-request {
            width: 100%;
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
        }

        /* Yon Menyu */
        .side-menu-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.4); z-index: 99; display: none;
        }
        .side-menu {
            position: fixed; top: 0; left: -80%; width: 75%; height: 100%;
            background: #ffffff; z-index: 100; transition: left 0.3s ease;
            box-shadow: 2px 0 15px rgba(0,0,0,0.2); padding: 24px 0;
        }
        .side-menu.open { left: 0; }
        .user-profile { padding: 0 20px 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: #ffcc00; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .menu-item { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Xarita -->
    <div id="map"></div>

    <!-- Markazdagi Qizil Pin -->
    <div class="center-pin-container" id="centerPin">
        <div class="center-pin"></div>
        <div class="pin-shadow"></div>
    </div>

    <!-- Tugmalar -->
    <button class="map-btn btn-menu" id="topBtn" onclick="handleTopBtnClick()">☰</button>
    <button class="map-btn btn-layers" onclick="changeMapType()">🗺️</button>
    <button class="map-btn btn-locate" id="locBtn" onclick="locateMe()">🎯</button>

    <!-- Yon Menyu -->
    <div class="side-menu-overlay" id="menuOverlay" onclick="toggleSideMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="user-profile">
            <div class="user-avatar">A</div>
            <div>
                <div style="font-weight: 700; font-size: 16px;" id="uName">Foydalanuvchi</div>
                <div style="font-size: 12px; color: #888;" id="uPhone">+998 50 052 79 77</div>
            </div>
        </div>
        <div style="padding: 10px 0;">
            <div class="menu-item" onclick="alert('Xavfsizlik: Barcha haydovchilar maxsus tekshiruvdan o\'tgan.')"><span>🛡️ Xavfsizlik</span><span>›</span></div>
            <div class="menu-item" onclick="window.location.href='https://t.me/Amirovffff'"><span>🎧 Qo\'llab-quvvatlash</span><span>›</span></div>
        </div>
    </div>

    <!-- 1-EKRAN: Qidiruv paneli -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle-bar" onclick="toggleSheetExpand()"></div>
        <div class="title-text" id="sheetTitle">Qayerga borasiz?</div>

        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Manzil yoki joy nomini qidiring..." onfocus="expandSheet()" oninput="searchNearby20Km(this.value)">
        </div>

        <div class="search-results" id="searchResults"></div>
    </div>

    <!-- 2-EKRAN (3-RASM): Safar tafsilotlari -->
    <div class="overview-sheet" id="overviewSheet">
        <div style="font-size: 18px; font-weight: 700; color: #111;">Safaringiz ma'lumotlari</div>

        <div class="route-points">
            <div class="point-item">
                <div class="point-left">
                    <div class="dot dot-start"></div>
                    <span class="point-name" id="overviewStart">Chiqish joyingiz</span>
                </div>
                <button class="btn-note" onclick="addNote()">📝 Izoh</button>
            </div>
            <div class="point-item">
                <div class="point-left">
                    <div class="dot dot-end"></div>
                    <span class="point-name" id="overviewDest">Borish manzili</span>
                </div>
            </div>
        </div>

        <div class="tariff-card">
            <div class="tariff-left">
                <img src="https://cdn-icons-png.flaticon.com/512/3097/3097180.png" class="car-img" alt="Taxi">
                <div>
                    <div class="tariff-name">Standart</div>
                    <div class="tariff-seats" id="seatsDist">4 kishilik • -- km</div>
                </div>
            </div>
            <div class="price-val" id="basePrice">15 000 UZS</div>
        </div>

        <div class="pricing-row">
            <div class="tip-selector">🔗 Choypuli: 2 000 UZS (5%) ⌵</div>
            <div class="total-badge" id="totalPrice">Jami: 17 000 UZS</div>
        </div>

        <button class="btn-request" id="submitOrderBtn" onclick="sendTaxiOrder()">🚖 Taksi chaqirish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let map, multiRoute;
        let userCoords = [39.6542, 66.9597]; // Chiqish nuqtasi
        let destCoords = null; // Borish nuqtasi
        let startAddress = "Tanlangan joy";
        let destAddress = "";
        let finalTripPrice = "15 000 UZS";

        let mapTypeIndex = 0;
        const mapTypes = ['yandex#map', 'yandex#satellite', 'yandex#hybrid'];

        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        ymaps.ready(() => {
            map = new ymaps.Map("map", {
                center: userCoords,
                zoom: 16,
                type: 'yandex#map',
                controls: []
            });

            locateMe();
            loadUserData();

            map.events.add('actionend', () => {
                userCoords = map.getCenter();
                ymaps.geocode(userCoords).then(res => {
                    const firstGeo = res.geoObjects.get(0);
                    if (firstGeo) {
                        startAddress = firstGeo.getAddressLine();
                        document.getElementById("sheetTitle").innerText = "📍 " + (firstGeo.getName() || "Tanlangan joy");
                    }
                });
            });

            map.events.add('click', () => {
                collapseSheet();
            });
        });

        function changeMapType() {
            mapTypeIndex = (mapTypeIndex + 1) % mapTypes.length;
            map.setType(mapTypes[mapTypeIndex]);
        }

        function locateMe() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userCoords = [pos.coords.latitude, pos.coords.longitude];
                    map.setCenter(userCoords, 16, { duration: 300 });
                }, null, { enableHighAccuracy: true });
            }
        }

        function expandSheet() {
            document.getElementById("bottomSheet").classList.add("expanded");
            document.getElementById("searchResults").style.display = "flex";
            document.getElementById("locBtn").style.bottom = "84vh";
        }

        function collapseSheet() {
            document.getElementById("bottomSheet").classList.remove("expanded");
            document.getElementById("searchResults").style.display = "none";
            document.getElementById("locBtn").style.bottom = "220px";
            document.getElementById("searchInput").blur();
        }

        function toggleSheetExpand() {
            const sheet = document.getElementById("bottomSheet");
            if (sheet.classList.contains("expanded")) {
                collapseSheet();
            } else {
                expandSheet();
            }
        }

        // 20 KM ICHIDA MANZIL QIDIRISH
        function searchNearby20Km(query) {
            if (query.length < 2) return;

            ymaps.suggest(query, {
                boundedBy: [
                    [userCoords[0] - 0.18, userCoords[1] - 0.18],
                    [userCoords[0] + 0.18, userCoords[1] + 0.18]
                ]
            }).then(items => {
                const container = document.getElementById("searchResults");
                container.innerHTML = "";

                items.forEach(item => {
                    ymaps.geocode(item.value).then(res => {
                        const geoObj = res.geoObjects.get(0);
                        if (!geoObj) return;

                        const targetCoords = geoObj.geometry.getCoordinates();
                        const dist = getDistanceKm(userCoords[0], userCoords[1], targetCoords[0], targetCoords[1]);

                        if (dist <= 20) {
                            const div = document.createElement("div");
                            div.className = "result-item";
                            div.innerHTML = `
                                <div>
                                    <div class="result-title">${item.displayName.split(',')[0]}</div>
                                    <div class="result-sub">${item.value}</div>
                                </div>
                                <div class="result-dist">${dist.toFixed(1)} km</div>
                            `;
                            // MANZIL TANLANGANDA TO'G'RIDAN-TO'G'RI 3-EKRANGA O'TISH
                            div.onclick = () => {
                                destCoords = targetCoords;
                                destAddress = item.value;
                                switchToOverview(dist);
                            };
                            container.appendChild(div);
                        }
                    });
                });
            });
        }

        // 3-EKRAN: SAFAR TAFSILOTLARIGA O'TISH VA MARSHRUT CHIZISH
        function switchToOverview(distanceKm) {
            document.getElementById("bottomSheet").style.display = "none";
            document.getElementById("overviewSheet").style.display = "flex";
            document.getElementById("centerPin").style.display = "none"; // Markaziy pinni yashirish
            document.getElementById("topBtn").innerText = "←";
            document.getElementById("locBtn").style.bottom = "50vh";

            document.getElementById("overviewStart").innerText = startAddress;
            document.getElementById("overviewDest").innerText = destAddress;
            document.getElementById("seatsDist").innerText = `4 kishilik • ${distanceKm.toFixed(1)} km`;

            // Narxni hisoblash (5 000 min + 2 000/km + 2 000 tip)
            const baseCalc = Math.round((5000 + (distanceKm * 2000)) / 500) * 500;
            const totalCalc = baseCalc + 2000;
            
            document.getElementById("basePrice").innerText = baseCalc.toLocaleString() + " UZS";
            document.getElementById("totalPrice").innerText = "Jami: " + totalCalc.toLocaleString() + " UZS";
            finalTripPrice = totalCalc.toLocaleString() + " UZS";

            // Xaritada yo'nalish chizish (Yandex MultiRoute)
            if (multiRoute) map.geoObjects.remove(multiRoute);
            multiRoute = new ymaps.multiRouter.MultiRoute({
                referencePoints: [userCoords, destCoords],
                params: { results: 1 }
            }, {
                boundsAutoApply: true,
                routeActiveStrokeColor: "#ff3333",
                routeActiveStrokeWidth: 5
            });
            map.geoObjects.add(multiRoute);
        }

        function handleTopBtnClick() {
            if (document.getElementById("overviewSheet").style.display === "flex") {
                // Orqaga qaytish
                document.getElementById("overviewSheet").style.display = "none";
                document.getElementById("bottomSheet").style.display = "flex";
                document.getElementById("centerPin").style.display = "flex";
                document.getElementById("topBtn").innerText = "☰";
                document.getElementById("locBtn").style.bottom = "220px";
                if (multiRoute) map.geoObjects.remove(multiRoute);
                collapseSheet();
            } else {
                toggleSideMenu();
            }
        }

        function addNote() {
            prompt("Haydovchi uchun izoh (masalan: Dom oldida kuting):");
        }

        function toggleSideMenu() {
            const menu = document.getElementById("sideMenu");
            const overlay = document.getElementById("menuOverlay");
            if (menu.classList.contains("open")) {
                menu.classList.remove("open");
                overlay.style.display = "none";
            } else {
                menu.classList.add("open");
                overlay.style.display = "block";
            }
        }

        function loadUserData() {
            const name = localStorage.getItem("taxi_user_name") || "Foydalanuvchi";
            const phone = localStorage.getItem("taxi_user_phone") || "+998 50 052 79 77";
            document.getElementById("uName").innerText = name;
            document.getElementById("uPhone").innerText = phone;
        }

        function sendTaxiOrder() {
            const btn = document.getElementById("submitOrderBtn");
            btn.innerText = "Buyurtma yuborilmoqda...";
            btn.disabled = true;

            const payload = {
                type: "client_order",
                lat: userCoords[0],
                lon: userCoords[1],
                destination: destAddress,
                price: finalTripPrice,
                client_name: document.getElementById("uName").innerText,
                client_phone: document.getElementById("uPhone").innerText
            };

            tg.sendData(JSON.stringify(payload));
            setTimeout(() => { tg.close(); }, 300);
        }
    </script>
</body>
</html>
