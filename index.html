<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taksi Buyurtma</title>
    <!-- Yandex Maps API -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #121212; color: #fff; }
        #map { height: 78vh; width: 100%; }
        .container { padding: 12px; text-align: center; background: #1e1e1e; }
        .btn { background: #ffcc00; color: #000; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 10px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="container">
        <button class="btn" onclick="sendLocation()">🚖 Shu yerdan taksi chaqirish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let myMap, userPlacemark;

        ymaps.ready(init);

        function init() {
            // Sun'iy yo'ldosh va qorong'u rejim xaritasi
            myMap = new ymaps.Map("map", {
                center: [39.6542, 66.9597],
                zoom: 15,
                type: 'yandex#hybrid',
                controls: ['zoomControl']
            });

            // Mijoz belgisi
            userPlacemark = new ymaps.Placemark(myMap.getCenter(), {}, {
                draggable: true,
                preset: 'islands#redDotIcon'
            });

            myMap.geoObjects.add(userPlacemark);

            // Joylashuvni aniqlash
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const coords = [position.coords.latitude, position.coords.longitude];
                    myMap.setCenter(coords, 16);
                    userPlacemark.geometry.setCoordinates(coords);
                });
            }

            // Online haydovchilarni ko'rsatish
            loadOnlineDrivers();
        }

        function loadOnlineDrivers() {
            const drivers = [
                { id: 1, lat: 39.6560, lon: 66.9610 },
                { id: 2, lat: 39.6520, lon: 66.9550 }
            ];

            drivers.forEach(driver => {
                const driverPlacemark = new ymaps.Placemark([driver.lat, driver.lon], {
                    hintContent: 'Online Taksi'
                }, {
                    preset: 'islands#yellowTaxiIcon'
                });
                myMap.geoObjects.add(driverPlacemark);
            });
        }

        function sendLocation() {
            const coords = userPlacemark.geometry.getCoordinates();
            const data = {
                latitude: coords[0],
                longitude: coords[1]
            };
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
