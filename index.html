<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taksi Chaqirish</title>
    <!-- Yandex Maps API -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e1e1e;
            border-top: 2px solid #ffcc00;
            border-radius: 20px 20px 0 0;
            padding: 16px 20px 28px 20px;
            z-index: 10;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-text {
            font-size: 13px;
            color: #bbb;
            text-align: center;
        }

        .btn-order {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-order:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="bottom-bar">
        <div class="info-text">📍 Xaritadan joylashuvingizni belgilang</div>
        <button class="btn-order" id="orderBtn" onclick="sendOrder()">🚖 Shu yerdan taksi chaqirish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let myMap, placemark;
        let defaultCoords = [39.6542, 66.9597]; // Samarqand

        ymaps.ready(() => {
            myMap = new ymaps.Map("map", {
                center: defaultCoords,
                zoom: 16,
                controls: ['zoomControl']
            });

            placemark = new ymaps.Placemark(defaultCoords, {
                hintContent: "Siz shu yerdasiz"
            }, {
                draggable: true,
                preset: 'islands#redDotIcon'
            });

            myMap.geoObjects.add(placemark);

            // Jonli geolokatsiyani aniqlash
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const coords = [pos.coords.latitude, pos.coords.longitude];
                    myMap.setCenter(coords, 16);
                    placemark.geometry.setCoordinates(coords);
                }, null, { enableHighAccuracy: true });
            }

            // Xaritani bosganda belgini ko'chirish
            myMap.events.add('click', e => {
                const coords = e.get('coords');
                placemark.geometry.setCoordinates(coords);
            });
        });

        function sendOrder() {
            const coords = placemark.geometry.getCoordinates();
            const btn = document.getElementById("orderBtn");
            btn.innerText = "⏳ Yuborilmoqda...";
            btn.disabled = true;

            const orderData = {
                type: "client_order",
                lat: coords[0],
                lon: coords[1]
            };

            // Telegram botga to'g'ridan-to'g'ri ma'lumot yuborish
            tg.sendData(JSON.stringify(orderData));
        }
    </script>
</body>
</html>
