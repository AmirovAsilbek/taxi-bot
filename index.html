<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Express Taxi</title>
    <!-- Yandex Xarita va Qidiruv API -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ&suggest_apikey=YOUR_KEY" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff; }

        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* MARKAZIY QOTIB TURGAN SARIQ NISHON (PIN) */
        .center-pin-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            z-index: 15;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .center-pin {
            width: 38px;
            height: 38px;
            background: #ffcc00;
            border: 3px solid #111;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .center-pin::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #111;
            border-radius: 50%;
            transform: rotate(45deg);
        }
        .pin-shadow {
            width: 14px;
            height: 6px;
            background: rgba(0,0,0,0.25);
            border-radius: 50%;
            margin-top: 2px;
        }

        /* Navigatsiya tugmalari */
        .btn-menu {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 20;
            background: #ffffff;
            border: none;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            cursor: pointer;
            font-size: 20px;
        }
        .btn-locate {
            position: absolute;
            bottom: 220px;
            right: 18px;
            z-index: 20;
            background: #ffffff;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            cursor: pointer;
            font-size: 22px;
            transition: bottom 0.3s ease;
        }

        /* SURILUVCHI PASTKI PANEL */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            z-index: 30;
            box-shadow: 0 -6px 30px rgba(0,0,0,0.15);
            padding: 12px 20px 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: height 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .bottom-sheet.expanded {
            height: 80vh;
        }

        .sheet-handle-bar {
            width: 44px;
            height: 5px;
            background: #dcdde1;
            border-radius: 5px;
            margin: 0 auto 6px auto;
            cursor: grab;
        }

        .title-text {
            font-size: 22px;
            font-weight: 800;
            color: #111;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f1f2f6;
            border-radius: 16px;
            padding: 14px 16px;
            gap: 12px;
        }
        .search-input {
            border: none;
            background: transparent;
            font-size: 16px;
            color: #111;
            width: 100%;
            outline: none;
        }

        /* Qidiruv natijalari ro'yxati */
        .search-results {
            display: none;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: calc(80vh - 170px);
            padding-top: 8px;
        }
        .result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
        }
        .result-item:active { background: #e9ecef; }
        .result-title { font-weight: 600; font-size: 15px; color: #222; }
        .result-sub { font-size: 12px; color: #777; }

        /* Buyurtma berish tugmasi */
        .btn-order-now {
            display: none;
            width: 100%;
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: auto;
        }

        /* Yon Menyu */
        .side-menu-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.4);
            z-index: 99;
            display: none;
        }
        .side-menu {
            position: fixed;
            top: 0; left: -80%; width: 75%; height: 100%;
            background: #ffffff;
            z-index: 100;
            transition: left 0.3s ease;
            box-shadow: 2px 0 15px rgba(0,0,0,0.2);
            padding: 24px 0;
        }
        .side-menu.open { left: 0; }
        .user-profile { padding: 0 20px 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: #ffcc00; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .menu-item { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Xarita -->
    <div id="map"></div>

    <!-- Markazda qotib turuvchi pin -->
    <div class="center-pin-container">
        <div class="center-pin"></div>
        <div class="pin-shadow"></div>
    </div>

    <!-- Tugmalar -->
    <button class="btn-menu" onclick="toggleSideMenu()">☰</button>
    <button class="btn-locate" id="locBtn" onclick="locateMe()">🎯</button>

    <!-- Yon Menyu -->
    <div class="side-menu-overlay" id="menuOverlay" onclick="toggleSideMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="user-profile">
            <div class="user-avatar" id="uAvatar">A</div>
            <div>
                <div style="font-weight: 700; font-size: 16px;" id="uName">Foydalanuvchi</div>
                <div style="font-size: 12px; color: #888;" id="uPhone">+998 50 052 79 77</div>
            </div>
        </div>
        <div style="padding: 10px 0;">
            <div class="menu-item" onclick="alert('Xavfsizlik: Barcha haydovchilar maxsus tekshiruvdan o\'tgan.')"><span>🛡️ Xavfsizlik</span><span>›</span></div>
            <div class="menu-item" onclick="window.location.href='https://t.me/Amirovffff'"><span>🎧 Qo\'llab-quvvatlash</span><span>›</span></div>
        </div>
    </div>

    <!-- Suriluvchi Panel -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle-bar" onclick="toggleSheetExpand()"></div>
        
        <div class="title-text" id="sheetTitle">Qayerga borasiz?</div>

        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Manzil yoki joy nomini qidiring..." onfocus="expandSheet()" oninput="searchLocation(this.value)">
        </div>

        <!-- Shahardagi joylar ro'yxati -->
        <div class="search-results" id="searchResults"></div>

        <button class="btn-order-now" id="orderBtn" onclick="sendTaxiOrder()">🚖 Shu yerdan taksi chaqirish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let map;
        let currentCity = "Samarqand";
        let userCoords = [39.6542, 66.9597];
        let selectedAddress = "Tanlangan joy";

        ymaps.ready(() => {
            map = new ymaps.Map("map", {
                center: userCoords,
                zoom: 16,
                controls: []
            });

            locateMe();
            loadUserData();

            // Xarita surilib to'xtaganda markazdagi manzilni aniqlash
            map.events.add('actionend', () => {
                userCoords = map.getCenter();
                ymaps.geocode(userCoords).then(res => {
                    const firstGeo = res.geoObjects.get(0);
                    if (firstGeo) {
                        selectedAddress = firstGeo.getAddressLine();
                        document.getElementById("sheetTitle").innerText = "📍 " + (firstGeo.getName() || "Tanlangan manzil");
                    }
                });
            });
        });

        function locateMe() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userCoords = [pos.coords.latitude, pos.coords.longitude];
                    map.setCenter(userCoords, 16, { duration: 300 });
                }, null, { enableHighAccuracy: true });
            }
        }

        // Panelni surish va kattalashtirish
        function expandSheet() {
            document.getElementById("bottomSheet").classList.add("expanded");
            document.getElementById("searchResults").style.display = "flex";
            document.getElementById("locBtn").style.bottom = "82vh";
        }

        function collapseSheet() {
            document.getElementById("bottomSheet").classList.remove("expanded");
            document.getElementById("searchResults").style.display = "none";
            document.getElementById("locBtn").style.bottom = "220px";
        }

        function toggleSheetExpand() {
            const sheet = document.getElementById("bottomSheet");
            if (sheet.classList.contains("expanded")) {
                collapseSheet();
            } else {
                expandSheet();
            }
        }

        // Shahar doirasida manzil qidirish
        function searchLocation(query) {
            if (query.length < 2) return;

            ymaps.suggest(currentCity + ", " + query).then(items => {
                const resultsContainer = document.getElementById("searchResults");
                resultsContainer.innerHTML = "";

                items.forEach(item => {
                    const div = document.createElement("div");
                    div.className = "result-item";
                    div.innerHTML = `
                        <span style="font-size: 20px;">📍</span>
                        <div>
                            <div class="result-title">${item.displayName.split(',')[0]}</div>
                            <div class="result-sub">${item.value}</div>
                        </div>
                    `;
                    div.onclick = () => {
                        ymaps.geocode(item.value).then(res => {
                            const coords = res.geoObjects.get(0).geometry.getCoordinates();
                            map.setCenter(coords, 17, { duration: 400 });
                            selectedAddress = item.value;
                            document.getElementById("sheetTitle").innerText = "📍 " + item.displayName.split(',')[0];
                            document.getElementById("searchInput").value = item.displayName.split(',')[0];
                            collapseSheet();
                            document.getElementById("orderBtn").style.display = "block";
                        });
                    };
                    resultsContainer.appendChild(div);
                });
            });
        }

        function toggleSideMenu() {
            const menu = document.getElementById("sideMenu");
            const overlay = document.getElementById("menuOverlay");
            if (menu.classList.contains("open")) {
                menu.classList.remove("open");
                overlay.style.display = "none";
            } else {
                menu.classList.add("open");
                overlay.style.display = "block";
            }
        }

        function loadUserData() {
            const name = localStorage.getItem("taxi_user_name") || "Foydalanuvchi";
            const phone = localStorage.getItem("taxi_user_phone") || "+998 50 052 79 77";
            document.getElementById("uName").innerText = name;
            document.getElementById("uPhone").innerText = phone;
            document.getElementById("uAvatar").innerText = name.charAt(0).toUpperCase();
        }

        function sendTaxiOrder() {
            const btn = document.getElementById("orderBtn");
            btn.innerText = "Buyurtma yuborilmoqda...";
            btn.disabled = true;

            const payload = {
                type: "client_order",
                lat: userCoords[0],
                lon: userCoords[1],
                address: selectedAddress,
                client_name: document.getElementById("uName").innerText,
                client_phone: document.getElementById("uPhone").innerText
            };

            tg.sendData(JSON.stringify(payload));
            setTimeout(() => { tg.close(); }, 300);
        }
    </script>
</body>
</html>
