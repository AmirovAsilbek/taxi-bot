<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taksi Buyurtma</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; overflow: hidden; }
        #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1; }
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: #1e1e1e; border-top: 2px solid #ffcc00; z-index: 20; border-radius: 20px 20px 0 0; padding: 15px 20px 25px 20px; }
        .btn { background: #ffcc00; color: #000; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 14px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="bottom-sheet">
        <button class="btn" id="orderBtn" onclick="requestTaxi()">🚖 Shu yerdan taksi chaqirish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let myMap, userPlacemark;

        ymaps.ready(() => {
            myMap = new ymaps.Map("map", { center: [39.6542, 66.9597], zoom: 16, controls: ['zoomControl'] });
            userPlacemark = new ymaps.Placemark(myMap.getCenter(), {}, { draggable: true, preset: 'islands#redCircleDotIcon' });
            myMap.geoObjects.add(userPlacemark);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const coords = [pos.coords.latitude, pos.coords.longitude];
                    myMap.setCenter(coords, 16);
                    userPlacemark.geometry.setCoordinates(coords);
                });
            }
        });

        function requestTaxi() {
            const coords = userPlacemark.geometry.getCoordinates();
            document.getElementById('orderBtn').innerText = '⏳ Yuborilmoqda...';
            
            // Botga koordinatalarni yuborish
            tg.sendData(JSON.stringify({
                latitude: coords[0],
                longitude: coords[1]
            }));
        }
    </script>
</body>
</html>
