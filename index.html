<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Express Taxi</title>
    <!-- Yandex Xarita API -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff; }

        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* MARKAZIY QIZIL NISHON */
        .center-pin-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            z-index: 15;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .center-pin {
            width: 40px;
            height: 40px;
            background: #ff3333;
            border: 3px solid #111;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 14px rgba(255, 51, 51, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .center-pin::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            transform: rotate(45deg);
        }
        .pin-shadow {
            width: 14px;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            margin-top: 2px;
        }

        /* Navigatsiya tugmalari */
        .map-btn {
            position: absolute;
            z-index: 20;
            background: #ffffff;
            border: none;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            cursor: pointer;
            font-size: 20px;
        }
        .btn-menu { top: 18px; left: 18px; }
        .btn-layers { top: 18px; right: 18px; font-size: 18px; }
        .btn-locate { bottom: 230px; right: 18px; font-size: 22px; transition: bottom 0.3s ease; }

        /* 1-EKRAN: PASTKI PANEL */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 220px;
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            z-index: 30;
            box-shadow: 0 -6px 30px rgba(0,0,0,0.15);
            padding: 10px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: height 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .bottom-sheet.expanded { height: 85vh; }

        /* Rasmdagi tutqich zonasi */
        .handle-area {
            width: 100%;
            padding: 6px 0 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .sheet-handle-bar {
            width: 52px;
            height: 6px;
            background: #dcdde1;
            border-radius: 6px;
        }

        .title-text {
            font-size: 19px;
            font-weight: 800;
            color: #111;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f1f2f6;
            border-radius: 16px;
            padding: 14px 16px;
            gap: 12px;
        }
        .search-input {
            border: none;
            background: transparent;
            font-size: 15px;
            color: #111;
            width: 100%;
            outline: none;
        }

        /* Qidiruv natijalari */
        .search-results {
            display: none;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
            padding: 6px 0;
        }
        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #f8f9fa;
            border: 1.5px solid transparent;
            border-radius: 14px;
            cursor: pointer;
        }
        .result-item.selected { border-color: #ff3333; background: #fff5f5; }
        .result-title { font-weight: 700; font-size: 14px; color: #222; }
        .result-sub { font-size: 12px; color: #777; }
        .result-dist { font-size: 12px; font-weight: 800; color: #ff3333; white-space: nowrap; margin-left: 8px; }

        /* QIZIL BORISH TUGMASI */
        .btn-go-action {
            display: block;
            width: 100%;
            background: #ff3333;
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.35);
            margin-top: 4px;
        }
        .btn-go-action:active { transform: scale(0.98); background: #e02424; }

        /* 2-EKRAN: SAFAR TAFSILOTLARI */
        .overview-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48vh;
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            z-index: 30;
            box-shadow: 0 -6px 30px rgba(0,0,0,0.15);
            padding: 18px 20px 24px 20px;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }

        .route-points { display: flex; flex-direction: column; gap: 10px; }
        .point-item { display: flex; align-items: center; justify-content: space-between; }
        .point-left { display: flex; align-items: center; gap: 10px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-start { background: #ffcc00; }
        .dot-end { background: #ff3333; }
        .point-name { font-size: 14px; font-weight: 600; color: #222; }

        .btn-note {
            background: #f4f4f6;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
        }

        .tariff-card {
            background: #ffffff;
            border: 1.5px solid #ececec;
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tariff-left { display: flex; align-items: center; gap: 12px; }
        .car-img { width: 48px; height: auto; }
        .tariff-name { font-size: 15px; font-weight: 700; }
        .tariff-seats { font-size: 12px; color: #888; }
        .price-val { font-size: 16px; font-weight: 800; }

        .pricing-row { display: flex; align-items: center; justify-content: space-between; }
        .tip-selector { font-size: 13px; color: #444; font-weight: 600; }
        .total-badge {
            border: 1.5px solid #ffcc00;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            color: #111;
        }

        .btn-request {
            width: 100%;
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
        }

        /* Yon Menyu */
        .side-menu-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.4); z-index: 99; display: none;
        }
        .side-menu {
            position: fixed; top: 0; left: -80%; width: 75%; height: 100%;
            background: #ffffff; z-index: 100; transition: left 0.3s ease;
            box-shadow: 2px 0 15px rgba(0,0,0,0.2); padding: 24px 0;
        }
        .side-menu.open { left: 0; }
        .user-profile { padding: 0 20px 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: #ffcc00; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .menu-item { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Xarita -->
    <div id="map"></div>

    <!-- Markazdagi Harakatlanuvchi Qizil Pin -->
    <div class="center-pin-container" id="centerPin">
        <div class="center-pin"></div>
        <div class="pin-shadow"></div>
    </div>

    <!-- Navigatsiya Tugmalari -->
    <button class="map-btn btn-menu" id="topBtn" onclick="handleTopBtnClick()">☰</button>
    <button class="map-btn btn-layers" onclick="changeMapType()">🗺️</button>
    <button class="map-btn btn-locate" id="locBtn" onclick="locateMe()">🎯</button>

    <!-- Yon Menyu -->
    <div class="side-menu-overlay" id="menuOverlay" onclick="toggleSideMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="user-profile">
            <div class="user-avatar">A</div>
            <div>
                <div style="font-weight: 700; font-size: 16px;" id="uName">Foydalanuvchi</div>
                <div style="font-size: 12px; color: #888;" id="uPhone">+998 50 052 79 77</div>
            </div>
        </div>
        <div style="padding: 10px 0;">
            <div class="menu-item" onclick="alert('Xavfsizlik: Barcha haydovchilar maxsus tekshiruvdan o\'tgan.')"><span>🛡️ Xavfsizlik</span><span>›</span></div>
            <div class="menu-item" onclick="window.location.href='https://t.me/Amirovffff'"><span>🎧 Qo\'llab-quvvatlash</span><span>›</span></div>
        </div>
    </div>

    <!-- 1-EKRAN: Xaritadan belgilash va Qidiruv paneli -->
    <div class="bottom-sheet" id="bottomSheet">
        <!-- Bosilganda yoki tortilganda pastga tushuvchi tutqich -->
        <div class="handle-area" onclick="collapseSheet()" id="handleArea">
            <div class="sheet-handle-bar"></div>
        </div>

        <div class="title-text" id="sheetTitle">📍 Xaritadagi manzil</div>

        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Manzil yoki joy nomini qidiring..." onfocus="expandSheet()" oninput="handleSearchInput(this.value)">
        </div>

        <!-- Natijalar ro'yxati -->
        <div class="search-results" id="searchResults"></div>

        <!-- QIZIL BORISH TUGMASI -->
        <button class="btn-go-action" id="goActionBtn" onclick="goToOverview()">Borish</button>
    </div>

    <!-- 2-EKRAN: Safar tafsilotlari -->
    <div class="overview-sheet" id="overviewSheet">
        <div style="font-size: 18px; font-weight: 700; color: #111;">Safaringiz ma'lumotlari</div>

        <div class="route-points">
            <div class="point-item">
                <div class="point-left">
                    <div class="dot dot-start"></div>
                    <span class="point-name" id="overviewStart">Mening joylashuvim</span>
                </div>
                <button class="btn-note" onclick="addNote()">📝 Izoh</button>
            </div>
            <div class="point-item">
                <div class="point-left">
                    <div class="dot dot-end"></div>
                    <span class="point-name" id="overviewDest">Xaritadagi manzil</span>
                </div>
            </div>
        </div>

        <div class="tariff-card">
            <div class="tariff-left">
                <img src="https://cdn-icons-png.flaticon.com/512/3097/3097180.png" class="car-img" alt="Taxi">
                <div>
                    <div class="tariff-name">Standart</div>
                    <div class="tariff-seats" id="seatsDist">4 kishilik • -- km</div>
                </div>
            </div>
            <div class="price-val" id="basePrice">15 000 UZS</div>
        </div>

        <div class="pricing-row">
            <div class="tip-selector">🔗 Choypuli: 2 000 UZS (5%) ⌵</div>
            <div class="total-badge" id="totalPrice">Jami: 17 000 UZS</div>
        </div>

        <button class="btn-request" id="submitOrderBtn" onclick="sendTaxiOrder()">🚖 Taksi chaqirish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let map, multiRoute;
        let startCoords = [39.0833, 66.8333];
        let targetCoords = [39.0833, 66.8333];
        let targetName = "Xaritadan tanlangan joy";
        let targetDist = 1.0;
        let finalTripPrice = "15 000 UZS";
        let searchTimer = null;

        let mapTypeIndex = 0;
        const mapTypes = ['yandex#map', 'yandex#satellite', 'yandex#hybrid'];

        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        ymaps.ready(() => {
            map = new ymaps.Map("map", {
                center: startCoords,
                zoom: 16,
                type: 'yandex#map',
                controls: []
            });

            locateMe();
            loadUserData();

            // XARITA HARAKATLANISHI BOSHLANGANDA PANEL AVTOMATIK PASTGA TUSHADI
            map.events.add('actionbegin', () => {
                collapseSheet();
            });

            // XARITA TO'XTAGANDA MARKAZIY PIN OSTIDAGI MANZILNI ANIQLASH
            map.events.add('actionend', () => {
                targetCoords = map.getCenter();
                targetDist = getDistanceKm(startCoords[0], startCoords[1], targetCoords[0], targetCoords[1]);
                if (targetDist < 0.2) targetDist = 0.5;

                const revUrl = `https://photon.komoot.io/reverse?lat=${targetCoords[0]}&lon=${targetCoords[1]}`;
                fetch(revUrl)
                    .then(res => res.json())
                    .then(data => {
                        if (data.features && data.features.length > 0) {
                            const p = data.features[0].properties;
                            targetName = p.name || p.street || p.district || "Xaritadan tanlangan manzil";
                        } else {
                            targetName = "Xaritadagi belgilangan nuqta";
                        }
                        document.getElementById("sheetTitle").innerText = "📍 " + targetName;
                    })
                    .catch(() => {
                        targetName = "Xaritadagi belgilangan joy";
                        document.getElementById("sheetTitle").innerText = "📍 " + targetName;
                    });
            });

            // Xarita bosilganda markazlashtirish va panelni tushirish
            map.events.add('click', (e) => {
                collapseSheet();
                const clickPos = e.get('coords');
                map.setCenter(clickPos, map.getZoom(), { duration: 250 });
            });
        });

        // Swipe (surish) orqali pastga tushirish hodisalari
        let startY = 0;
        const handleArea = document.getElementById("handleArea");
        
        handleArea.addEventListener("touchstart", (e) => {
            startY = e.touches[0].clientY;
        }, { passive: true });

        handleArea.addEventListener("touchmove", (e) => {
            const currentY = e.touches[0].clientY;
            if (currentY - startY > 30) { // Pastga tortilganda
                collapseSheet();
            }
        }, { passive: true });

        function changeMapType() {
            mapTypeIndex = (mapTypeIndex + 1) % mapTypes.length;
            map.setType(mapTypes[mapTypeIndex]);
        }

        function locateMe() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    startCoords = [pos.coords.latitude, pos.coords.longitude];
                    targetCoords = startCoords;
                    map.setCenter(startCoords, 16, { duration: 300 });
                }, null, { enableHighAccuracy: true });
            }
        }

        function expandSheet() {
            document.getElementById("bottomSheet").classList.add("expanded");
            document.getElementById("searchResults").style.display = "flex";
            document.getElementById("locBtn").style.bottom = "87vh";
        }

        function collapseSheet() {
            document.getElementById("bottomSheet").classList.remove("expanded");
            document.getElementById("searchResults").style.display = "none";
            document.getElementById("locBtn").style.bottom = "230px";
            document.getElementById("searchInput").blur();
        }

        // QIDIRUV
        function handleSearchInput(query) {
            clearTimeout(searchTimer);
            if (query.trim().length < 2) {
                document.getElementById("searchResults").innerHTML = "";
                return;
            }

            searchTimer = setTimeout(() => {
                const container = document.getElementById("searchResults");
                container.innerHTML = "<div style='color:#888; padding:10px; text-align:center;'>Qidirilmoqda...</div>";

                const delta = 0.18;
                const bbox = `${startCoords[1] - delta},${startCoords[0] - delta},${startCoords[1] + delta},${startCoords[0] + delta}`;
                const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query.trim())}&lat=${startCoords[0]}&lon=${startCoords[1]}&bbox=${bbox}&limit=10`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        container.innerHTML = "";
                        if (!data.features || data.features.length === 0) {
                            container.innerHTML = "<div style='color:#888; padding:10px; text-align:center;'>20 km radiusda manzil topilmadi</div>";
                            return;
                        }

                        data.features.forEach(feat => {
                            const coords = [feat.geometry.coordinates[1], feat.geometry.coordinates[0]];
                            const dist = getDistanceKm(startCoords[0], startCoords[1], coords[0], coords[1]);

                            if (dist <= 20.0) {
                                const p = feat.properties;
                                const name = p.name || query;
                                const desc = [p.street, p.district, p.city].filter(Boolean).join(", ") || "Yaqin manzil";

                                const div = document.createElement("div");
                                div.className = "result-item";
                                div.innerHTML = `
                                    <div>
                                        <div class="result-title">${name}</div>
                                        <div class="result-sub">${desc}</div>
                                    </div>
                                    <div class="result-dist">${dist.toFixed(1)} km</div>
                                `;

                                div.onclick = () => {
                                    targetCoords = coords;
                                    targetName = name;
                                    targetDist = dist;
                                    map.setCenter(coords, 16, { duration: 300 });
                                    document.getElementById("sheetTitle").innerText = "📍 " + name;
                                    collapseSheet();
                                };

                                container.appendChild(div);
                            }
                        });
                    })
                    .catch(() => {
                        container.innerHTML = "<div style='color:#888; padding:10px; text-align:center;'>Manzil topilmadi</div>";
                    });
            }, 300);
        }

        // 3-EKRAN: SAFAR TAFSILOTLARIGA O'TISH
        function goToOverview() {
            document.getElementById("bottomSheet").style.display = "none";
            document.getElementById("overviewSheet").style.display = "flex";
            document.getElementById("centerPin").style.display = "none";
            document.getElementById("topBtn").innerText = "←";
            document.getElementById("locBtn").style.bottom = "50vh";

            document.getElementById("overviewStart").innerText = "Mening joylashuvim";
            document.getElementById("overviewDest").innerText = targetName;
            document.getElementById("seatsDist").innerText = `4 kishilik • ${targetDist.toFixed(1)} km`;

            // Narx hisoblash
            const baseCalc = Math.round((5000 + (targetDist * 2000)) / 500) * 500;
            const totalCalc = baseCalc + 2000;
            
            document.getElementById("basePrice").innerText = baseCalc.toLocaleString() + " UZS";
            document.getElementById("totalPrice").innerText = "Jami: " + totalCalc.toLocaleString() + " UZS";
            finalTripPrice = totalCalc.toLocaleString() + " UZS";

            // Xaritada yo'nalish chizish
            if (multiRoute) map.geoObjects.remove(multiRoute);
            multiRoute = new ymaps.multiRouter.MultiRoute({
                referencePoints: [startCoords, targetCoords],
                params: { results: 1 }
            }, {
                boundsAutoApply: true,
                routeActiveStrokeColor: "#ff3333",
                routeActiveStrokeWidth: 5
            });
            map.geoObjects.add(multiRoute);
        }

        function handleTopBtnClick() {
            if (document.getElementById("overviewSheet").style.display === "flex") {
                document.getElementById("overviewSheet").style.display = "none";
                document.getElementById("bottomSheet").style.display = "flex";
                document.getElementById("centerPin").style.display = "flex";
                document.getElementById("topBtn").innerText = "☰";
                document.getElementById("locBtn").style.bottom = "230px";
                if (multiRoute) map.geoObjects.remove(multiRoute);
                collapseSheet();
            } else {
                toggleSideMenu();
            }
        }

        function addNote() {
            prompt("Haydovchi uchun izoh:");
        }

        function toggleSideMenu() {
            const menu = document.getElementById("sideMenu");
            const overlay = document.getElementById("menuOverlay");
            if (menu.classList.contains("open")) {
                menu.classList.remove("open");
                overlay.style.display = "none";
            } else {
                menu.classList.add("open");
                overlay.style.display = "block";
            }
        }

        function loadUserData() {
            const name = localStorage.getItem("taxi_user_name") || "Foydalanuvchi";
            const phone = localStorage.getItem("taxi_user_phone") || "+998 50 052 79 77";
            document.getElementById("uName").innerText = name;
            document.getElementById("uPhone").innerText = phone;
        }

        function sendTaxiOrder() {
            const btn = document.getElementById("submitOrderBtn");
            btn.innerText = "Buyurtma yuborilmoqda...";
            btn.disabled = true;

            const payload = {
                type: "client_order",
                lat: startCoords[0],
                lon: startCoords[1],
                dest_lat: targetCoords[0],
                dest_lon: targetCoords[1],
                destination: targetName,
                distance: targetDist.toFixed(1) + " km",
                price: finalTripPrice,
                client_name: document.getElementById("uName").innerText,
                client_phone: document.getElementById("uPhone").innerText
            };

            tg.sendData(JSON.stringify(payload));
            setTimeout(() => { tg.close(); }, 300);
        }
    </script>
</body>
</html>
