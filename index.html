<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taksi Buyurtma</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #1c1c1e; color: white; }
    #map { height: 75vh; width: 100%; }
    .container { padding: 15px; text-align: center; }
    .btn { background: #ffcc00; color: #000; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 12px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="container">
    <button class="btn" onclick="sendLocation()">🚖 Shu yerdan taksi chaqirish</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let map = L.map('map').setView([38.861, 65.784], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    let marker = L.marker([38.861, 65.784], {draggable: true}).addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        map.setView([lat, lng], 15);
        marker.setLatLng([lat, lng]);
      });
    }

    function sendLocation() {
      const coords = marker.getLatLng();
      tg.sendData(JSON.stringify({
        latitude: coords.lat,
        longitude: coords.lng
      }));
    }
  </script>
</body>
</html>
