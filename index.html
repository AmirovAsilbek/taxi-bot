<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Express Taxi</title>
    <!-- Yandex Xarita API -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff; }

        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* MARKAZIY QIZIL NISHON (PIN) */
        .center-pin-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            z-index: 15;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .center-pin {
            width: 38px;
            height: 38px;
            background: #ff3333; /* QIZIL RANG */
            border: 3px solid #111;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 12px rgba(255, 51, 51, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .center-pin::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            transform: rotate(45deg);
        }
        .pin-shadow {
            width: 14px;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            margin-top: 2px;
        }

        /* Navigatsiya tugmalari */
        .map-btn {
            position: absolute;
            z-index: 20;
            background: #ffffff;
            border: none;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            cursor: pointer;
            font-size: 20px;
        }
        .btn-menu { top: 18px; left: 18px; }
        .btn-layers { top: 18px; right: 18px; } /* O'ng tarafdagi xarita qatlami */
        .btn-locate { bottom: 220px; right: 18px; font-size: 22px; transition: bottom 0.3s ease; }

        /* SURILUVCHI PASTKI PANEL */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            z-index: 30;
            box-shadow: 0 -6px 30px rgba(0,0,0,0.15);
            padding: 12px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: height 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .bottom-sheet.expanded { height: 82vh; }

        .sheet-handle-bar {
            width: 48px;
            height: 6px;
            background: #dcdde1;
            border-radius: 6px;
            margin: 0 auto 4px auto;
            cursor: pointer;
        }

        .title-text { font-size: 22px; font-weight: 800; color: #111; }

        .search-box {
            display: flex;
            align-items: center;
            background: #f1f2f6;
            border-radius: 16px;
            padding: 14px 16px;
            gap: 12px;
        }
        .search-input {
            border: none;
            background: transparent;
            font-size: 16px;
            color: #111;
            width: 100%;
            outline: none;
        }

        /* 20 KM Natijalar */
        .search-results {
            display: none;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: calc(82vh - 230px);
        }
        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #f8f9fa;
            border: 1px solid #ebebeb;
            border-radius: 12px;
            cursor: pointer;
        }
        .result-item:active { background: #e9ecef; }
        .result-title { font-weight: 700; font-size: 14px; color: #222; }
        .result-sub { font-size: 12px; color: #777; }
        .result-dist { font-size: 12px; font-weight: 700; color: #ff3333; }

        /* SARIQ HOSHIYALI BORISH TUGMASI */
        .btn-go-destination {
            display: none;
            width: 100%;
            background: #ffffff;
            color: #111;
            border: 3px solid #ffcc00;
            padding: 15px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            margin-top: auto;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.2);
            transition: 0.2s;
        }
        .btn-go-destination:active { background: #ffcc00; color: #000; }

        /* Yon Menyu */
        .side-menu-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.4); z-index: 99; display: none;
        }
        .side-menu {
            position: fixed; top: 0; left: -80%; width: 75%; height: 100%;
            background: #ffffff; z-index: 100; transition: left 0.3s ease;
            box-shadow: 2px 0 15px rgba(0,0,0,0.2); padding: 24px 0;
        }
        .side-menu.open { left: 0; }
        .user-profile { padding: 0 20px 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: #ffcc00; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .menu-item { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Xarita -->
    <div id="map"></div>

    <!-- Markazdagi Qizil Pin -->
    <div class="center-pin-container">
        <div class="center-pin"></div>
        <div class="pin-shadow"></div>
    </div>

    <!-- Tugmalar -->
    <button class="map-btn btn-menu" onclick="toggleSideMenu()">☰</button>
    <button class="map-btn btn-layers" onclick="changeMapType()">🗺️</button>
    <button class="map-btn btn-locate" id="locBtn" onclick="locateMe()">🎯</button>

    <!-- Yon Menyu -->
    <div class="side-menu-overlay" id="menuOverlay" onclick="toggleSideMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="user-profile">
            <div class="user-avatar">A</div>
            <div>
                <div style="font-weight: 700; font-size: 16px;" id="uName">Foydalanuvchi</div>
                <div style="font-size: 12px; color: #888;" id="uPhone">+998 50 052 79 77</div>
            </div>
        </div>
        <div style="padding: 10px 0;">
            <div class="menu-item" onclick="alert('Xavfsizlik: Barcha haydovchilar maxsus tekshiruvdan o\'tgan.')"><span>🛡️ Xavfsizlik</span><span>›</span></div>
            <div class="menu-item" onclick="window.location.href='https://t.me/Amirovffff'"><span>🎧 Qo\'llab-quvvatlash</span><span>›</span></div>
        </div>
    </div>

    <!-- Suriluvchi Pastki Panel -->
    <div class="bottom-sheet" id="bottomSheet">
        <!-- Tutqich: Bosilganda pastga/tepaga tushadi -->
        <div class="sheet-handle-bar" onclick="toggleSheetExpand()"></div>
        
        <div class="title-text" id="sheetTitle">Qayerga borasiz?</div>

        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Manzil yoki joy nomini qidiring..." onfocus="expandSheet()" oninput="searchNearby20Km(this.value)">
        </div>

        <!-- 20 km Natijalar ro'yxati -->
        <div class="search-results" id="searchResults"></div>

        <!-- Sariq hoshiyali Borish tugmasi -->
        <button class="btn-go-destination" id="goDestBtn" onclick="sendTaxiOrder()">shu manzilga borish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let map;
        let userCoords = [39.6542, 66.9597]; // Joylashuvingiz
        let selectedDestName = "";
        let mapTypeIndex = 0;
        const mapTypes = ['yandex#map', 'yandex#satellite', 'yandex#hybrid'];

        // Masofani hisoblash (km)
        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        ymaps.ready(() => {
            map = new ymaps.Map("map", {
                center: userCoords,
                zoom: 16,
                type: 'yandex#map',
                controls: []
            });

            locateMe();
            loadUserData();

            // Xarita siljib to'xtaganda
            map.events.add('actionend', () => {
                userCoords = map.getCenter();
                ymaps.geocode(userCoords).then(res => {
                    const firstGeo = res.geoObjects.get(0);
                    if (firstGeo) {
                        selectedDestName = firstGeo.getAddressLine();
                        document.getElementById("sheetTitle").innerText = "📍 " + (firstGeo.getName() || "Tanlangan joy");
                    }
                });
            });

            // Xarita bo'sh joyi bosilganda panel pastga tushadi
            map.events.add('click', () => {
                collapseSheet();
            });
        });

        // Xarita turlarini almashtirish
        function changeMapType() {
            mapTypeIndex = (mapTypeIndex + 1) % mapTypes.length;
            map.setType(mapTypes[mapTypeIndex]);
        }

        function locateMe() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userCoords = [pos.coords.latitude, pos.coords.longitude];
                    map.setCenter(userCoords, 16, { duration: 300 });
                }, null, { enableHighAccuracy: true });
            }
        }

        // Panelni boshqarish
        function expandSheet() {
            document.getElementById("bottomSheet").classList.add("expanded");
            document.getElementById("searchResults").style.display = "flex";
            document.getElementById("locBtn").style.bottom = "84vh";
        }

        function collapseSheet() {
            document.getElementById("bottomSheet").classList.remove("expanded");
            document.getElementById("searchResults").style.display = "none";
            document.getElementById("locBtn").style.bottom = "220px";
            document.getElementById("searchInput").blur();
        }

        function toggleSheetExpand() {
            const sheet = document.getElementById("bottomSheet");
            if (sheet.classList.contains("expanded")) {
                collapseSheet();
            } else {
                expandSheet();
            }
        }

        // 20 km masofadagi joylarni qidirish
        function searchNearby20Km(query) {
            if (query.length < 2) return;

            ymaps.suggest(query, {
                boundedBy: [
                    [userCoords[0] - 0.18, userCoords[1] - 0.18],
                    [userCoords[0] + 0.18, userCoords[1] + 0.18]
                ]
            }).then(items => {
                const container = document.getElementById("searchResults");
                container.innerHTML = "";

                items.forEach(item => {
                    ymaps.geocode(item.value).then(res => {
                        const geoObj = res.geoObjects.get(0);
                        if (!geoObj) return;

                        const targetCoords = geoObj.geometry.getCoordinates();
                        const dist = getDistanceKm(userCoords[0], userCoords[1], targetCoords[0], targetCoords[1]);

                        // Faqat 20 km ichidagi joylarni chiqarish
                        if (dist <= 20) {
                            const div = document.createElement("div");
                            div.className = "result-item";
                            div.innerHTML = `
                                <div>
                                    <div class="result-title">${item.displayName.split(',')[0]}</div>
                                    <div class="result-sub">${item.value}</div>
                                </div>
                                <div class="result-dist">${dist.toFixed(1)} km</div>
                            `;
                            div.onclick = () => {
                                map.setCenter(targetCoords, 17, { duration: 400 });
                                selectedDestName = item.value;
                                document.getElementById("sheetTitle").innerText = "📍 " + item.displayName.split(',')[0];
                                document.getElementById("searchInput").value = item.displayName.split(',')[0];
                                collapseSheet();
                                document.getElementById("goDestBtn").style.display = "block";
                            };
                            container.appendChild(div);
                        }
                    });
                });
            });
        }

        function toggleSideMenu() {
            const menu = document.getElementById("sideMenu");
            const overlay = document.getElementById("menuOverlay");
            if (menu.classList.contains("open")) {
                menu.classList.remove("open");
                overlay.style.display = "none";
            } else {
                menu.classList.add("open");
                overlay.style.display = "block";
            }
        }

        function loadUserData() {
            const name = localStorage.getItem("taxi_user_name") || "Foydalanuvchi";
            const phone = localStorage.getItem("taxi_user_phone") || "+998 50 052 79 77";
            document.getElementById("uName").innerText = name;
            document.getElementById("uPhone").innerText = phone;
        }

        function sendTaxiOrder() {
            const btn = document.getElementById("goDestBtn");
            btn.innerText = "Buyurtma yuborilmoqda...";
            btn.disabled = true;

            const payload = {
                type: "client_order",
                lat: userCoords[0],
                lon: userCoords[1],
                destination: selectedDestName || "Tanlangan manzil",
                client_name: document.getElementById("uName").innerText,
                client_phone: document.getElementById("uPhone").innerText
            };

            tg.sendData(JSON.stringify(payload));
            setTimeout(() => { tg.close(); }, 300);
        }
    </script>
</body>
</html>
