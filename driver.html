<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haydovchi Paneli</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #ffffff; }
        .card { background: #1e1e1e; border: 2px solid #ffcc00; border-radius: 16px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .status-badge { display: inline-block; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 15px; margin-bottom: 12px; }
        .active-status { background: #28a745; color: white; box-shadow: 0 0 10px rgba(40, 167, 69, 0.5); }
        .inactive-status { background: #dc3545; color: white; }
        .input-group { text-align: left; margin-bottom: 10px; }
        .input-group label { display: block; font-size: 13px; color: #ccc; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid #444; background: #2a2a2a; color: #fff; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #ffcc00; }
        .btn { border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 12px; width: 100%; cursor: pointer; }
        .btn-online { background: #28a745; color: #fff; }
        .btn-offline { background: #dc3545; color: #fff; }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="margin-top: 0; color: #ffcc00;">👤 Profil ma'lumotlari</h3>
        <div class="input-group">
            <label>Ism Familiya:</label>
            <input type="text" id="driverName" placeholder="Masalan: Ali Valiyev">
        </div>
        <div class="input-group">
            <label>Telefon raqam:</label>
            <input type="text" id="driverPhone" placeholder="+998 90 123 45 67">
        </div>
        <div class="input-group">
            <label>Mashina rusumi va raqami:</label>
            <input type="text" id="driverCar" placeholder="Cobalt (01 A 777 AA)">
        </div>
    </div>

    <div class="card">
        <h2>👨‍✈️ Haydovchi Kabineti</h2>
        <div id="statusBadge" class="status-badge inactive-status">🔴 Nofaol (Offline)</div>
        <p id="statusDesc" style="font-size: 13px; color: #aaa; margin-bottom: 15px;">Buyurtmalarni qabul qilish uchun liniyaga chiqing.</p>
        <button id="toggleBtn" class="btn btn-online" onclick="toggleWork()">🟢 Liniyaga chiqish (Online)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let isOnline = false;
        let watchId = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('driver_name')) document.getElementById('driverName').value = localStorage.getItem('driver_name');
            if (localStorage.getItem('driver_phone')) document.getElementById('driverPhone').value = localStorage.getItem('driver_phone');
            if (localStorage.getItem('driver_car')) document.getElementById('driverCar').value = localStorage.getItem('driver_car');
        });

        function toggleWork() {
            const name = document.getElementById('driverName').value.trim();
            const phone = document.getElementById('driverPhone').value.trim();
            const car = document.getElementById('driverCar').value.trim();

            if (!name || !phone || !car) {
                alert("Iltimos, ma'lumotlarni to'liq kiriting!");
                return;
            }

            localStorage.setItem('driver_name', name);
            localStorage.setItem('driver_phone', phone);
            localStorage.setItem('driver_car', car);

            isOnline = !isOnline;
            const badge = document.getElementById("statusBadge");
            const btn = document.getElementById("toggleBtn");
            const desc = document.getElementById("statusDesc");

            if (isOnline) {
                badge.className = "status-badge active-status";
                badge.innerText = "🟢 Faol (Online)";
                btn.className = "btn btn-offline";
                btn.innerText = "🔴 Liniyadan chiqish (Offline)";
                desc.innerText = "Jonli geolokatsiya uzatilmoqda...";

                // Real vaqt rejimida harakatni kuzatish (GPS Watcher)
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(pos => {
                        const coords = {
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            name: name,
                            car: car,
                            time: Date.now()
                        };
                        localStorage.setItem('live_driver_coords', JSON.stringify(coords));
                    }, null, { enableHighAccuracy: true, maximumAge: 3000 });
                }
            } else {
                badge.className = "status-badge inactive-status";
                badge.innerText = "🔴 Nofaol (Offline)";
                btn.className = "btn btn-online";
                btn.innerText = "🟢 Liniyaga chiqish (Online)";
                desc.innerText = "Liniyadan chiqdingiz.";

                if (watchId) navigator.geolocation.clearWatch(watchId);
                localStorage.removeItem('live_driver_coords');
            }
        }
    </script>
</body>
</html>
