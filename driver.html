<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haydovchi Paneli</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; }
        .card { background: #1e1e1e; border: 2px solid #ffcc00; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
        .input-group { margin-bottom: 8px; }
        .input-group label { display: block; font-size: 12px; color: #ccc; margin-bottom: 3px; }
        .input-group input { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; }
        .btn { border: none; padding: 13px; font-size: 15px; font-weight: bold; border-radius: 12px; width: 100%; cursor: pointer; }
        .btn-online { background: #28a745; color: #fff; }
        #driverMap { width: 100%; height: 350px; border-radius: 12px; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h4 style="margin: 0 0 10px 0; color: #ffcc00;">👤 Profil ma'lumotlari</h4>
        <div class="input-group">
            <label>Ism Familiya:</label>
            <input type="text" id="driverName" placeholder="Asilbek Amirov">
        </div>
        <div class="input-group">
            <label>Telefon raqam:</label>
            <input type="text" id="driverPhone" placeholder="+998901234567">
        </div>
        <div class="input-group">
            <label>Mashina rusumi va raqami:</label>
            <input type="text" id="driverCar" placeholder="70 N 079 NN">
        </div>
        <button class="btn btn-online" onclick="goOnline()">🟢 Liniyaga chiqish va Saqlash</button>
    </div>

    <div class="card">
        <b style="color: #ffcc00;">🧭 Yandex Xaritasi</b>
        <div id="driverMap"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let map, myCoords = [39.6542, 66.9597];

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('d_name')) document.getElementById('driverName').value = localStorage.getItem('d_name');
            if (localStorage.getItem('d_phone')) document.getElementById('driverPhone').value = localStorage.getItem('d_phone');
            if (localStorage.getItem('d_car')) document.getElementById('driverCar').value = localStorage.getItem('d_car');
        });

        ymaps.ready(() => {
            map = new ymaps.Map("driverMap", { center: myCoords, zoom: 15, controls: ['zoomControl'] });
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    myCoords = [pos.coords.latitude, pos.coords.longitude];
                    map.setCenter(myCoords, 15);
                    map.geoObjects.add(new ymaps.Placemark(myCoords, {}, { preset: 'islands#yellowTaxiIcon' }));
                });
            }
        });

        function goOnline() {
            const name = document.getElementById('driverName').value.trim();
            const phone = document.getElementById('driverPhone').value.trim();
            const car = document.getElementById('driverCar').value.trim();

            if (!name || !phone || !car) {
                alert("Iltimos, barcha maydonlarni to'ldiring!");
                return;
            }

            localStorage.setItem('d_name', name);
            localStorage.setItem('d_phone', phone);
            localStorage.setItem('d_car', car);

            // Botga haydovchi ma'lumotlarini uzatish
            tg.sendData(JSON.stringify({
                action: "driver_online",
                name: name,
                phone: phone,
                car: car,
                lat: myCoords[0],
                lon: myCoords[1]
            }));
        }
    </script>
</body>
</html>
