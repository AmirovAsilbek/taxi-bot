<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haydovchi Paneli</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #ffffff; text-align: center; }
        .card { background: #1e1e1e; border: 2px solid #ffcc00; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 15px; }
        .active-status { background: #28a745; color: white; }
        .inactive-status { background: #dc3545; color: white; }
        .btn { background: #ffcc00; color: #000; border: none; padding: 15px 20px; font-size: 16px; font-weight: bold; border-radius: 12px; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-toggle { background: #333; color: #fff; border: 1px solid #555; }
    </style>
</head>
<body>

    <div class="card">
        <h2>👨‍✈️ Haydovchi Kabineti</h2>
        <div id="statusBadge" class="status-badge inactive-status">🔴 Nofaol (Offline)</div>
        <p>Buyurtmalarni qabul qilish uchun liniyaga chiqing.</p>
        <button class="btn btn-toggle" onclick="toggleWork()">Liniyaga chiqish / Chiqish</button>
    </div>

    <div class="card">
        <h3>📊 Kunlik statistika</h3>
        <p>Qabul qilingan buyurtmalar: <b>0 ta</b></p>
        <p>Daromad: <b>0 so'm</b></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let isActive = false;

        function toggleWork() {
            isActive = !isActive;
            const badge = document.getElementById("statusBadge");

            if (isActive) {
                badge.className = "status-badge active-status";
                badge.innerText = "🟢 Faol (Online)";
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        tg.sendData(JSON.stringify({
                            driver_status: "active",
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude
                        }));
                    });
                }
            } else {
                badge.className = "status-badge inactive-status";
                badge.innerText = "🔴 Nofaol (Offline)";
                tg.sendData(JSON.stringify({ driver_status: "inactive" }));
            }
        }
    </script>
</body>
</html>
