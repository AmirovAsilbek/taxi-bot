<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haydovchi Paneli</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            min-height: 100%;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        .container {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100vh;
        }
        
        .card { 
            background: #1e1e1e; 
            border: 2px solid #ffcc00; 
            border-radius: 16px; 
            padding: 14px; 
            text-align: center; 
        }

        .status-badge { 
            display: inline-block; 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 14px; 
            margin-bottom: 8px; 
            transition: all 0.3s ease;
        }
        .active-status { background: #28a745; color: white; box-shadow: 0 0 10px rgba(40, 167, 69, 0.4); }
        .inactive-status { background: #dc3545; color: white; }

        .input-group { text-align: left; margin-bottom: 8px; }
        .input-group label { display: block; font-size: 12px; color: #ccc; margin-bottom: 3px; }
        .input-group input { 
            width: 100%; 
            padding: 9px; 
            border-radius: 8px; 
            border: 1.5px solid #444; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 14px; 
            outline: none; 
        }
        .input-group input:focus { border-color: #ffcc00; }

        .btn { 
            border: none; 
            padding: 13px; 
            font-size: 15px; 
            font-weight: bold; 
            border-radius: 12px; 
            width: 100%; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .btn-online { background: #28a745; color: #fff; }
        .btn-offline { background: #dc3545; color: #fff; }
        .btn-navi { 
            background: #ffcc00; 
            color: #000; 
            text-decoration: none; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px;
            margin-top: 10px;
            font-weight: bold;
        }

        .map-card {
            background: #1e1e1e;
            border: 2px solid #ffcc00;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            margin-bottom: 25px;
        }

        #driverMap {
            width: 100%;
            height: 480px; 
            border-radius: 12px;
            margin-top: 8px;
            overflow: hidden;
        }

        .route-info {
            font-size: 13px;
            color: #ddd;
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h4 style="margin: 0 0 10px 0; color: #ffcc00;">👤 Profil ma'lumotlari</h4>
            <div class="input-group">
                <label>Ism:</label>
                <input type="text" id="driverFirstName" placeholder="Ismingizni kiriting">
            </div>
            <div class="input-group">
                <label>Familiya:</label>
                <input type="text" id="driverLastName" placeholder="Familiyangizni kiriting">
            </div>
            <div class="input-group">
                <label>Telefon raqam:</label>
                <input type="text" id="driverPhone" placeholder="+998 (__) ___-__-__">
            </div>
            <div class="input-group">
                <label>Mashina rusumi va raqami:</label>
                <input type="text" id="driverCar" placeholder="Masalan: Cobalt (01 A 777 AA)">
            </div>
        </div>

        <div class="card">
            <h3 style="margin: 0 0 8px 0;">👨‍✈️ Haydovchi Kabineti</h3>
            <div id="statusBadge" class="status-badge inactive-status">🔴 Nofaol (Offline)</div>
            <p id="statusDesc" style="font-size: 12px; color: #aaa; margin: 0 0 10px 0;">Buyurtmalarni qabul qilish uchun liniyaga chiqing.</p>
            <button id="toggleBtn" class="btn btn-online" onclick="toggleWork()">🟢 Liniyaga chiqish va Saqlash</button>
        </div>

        <div class="map-card" id="mapSection">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <b style="color: #ffcc00; font-size: 15px;">🧭 Xaritadagi joylashuvingiz</b>
                <span id="routeStatus" style="font-size: 12px; color: #aaa;">Kutilmoqda...</span>
            </div>
            <div class="route-info" id="routeDetails" style="display: none;">
                <span>📏 Masofa: <b id="routeDist">0 km</b></span>
                <span>⏱ Vaqt: <b id="routeTime">0 daq</b></span>
            </div>

            <div id="driverMap"></div>

            <a id="openYandexNaviBtn" href="#" target="_blank" class="btn btn-navi" style="display: none;">
                🧭 Yandex Navigatorda yo'nalishni ochish
            </a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BOT_TOKEN = "8643693514:AAFvSzfPBXjoAmvt4ltAtlBD_zwLp63e93I";
        const ADMIN_ID = "8726943857";

        let isOnline = false;
        let watchId = null;
        let map, multiRoute;
        let driverMarker = null;
        let driverCoords = [39.6542, 66.9597];
        let lastClientCoords = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('driver_first_name')) document.getElementById('driverFirstName').value = localStorage.getItem('driver_first_name');
            if (localStorage.getItem('driver_last_name')) document.getElementById('driverLastName').value = localStorage.getItem('driver_last_name');
            if (localStorage.getItem('driver_phone')) document.getElementById('driverPhone').value = localStorage.getItem('driver_phone');
            if (localStorage.getItem('driver_car')) document.getElementById('driverCar').value = localStorage.getItem('driver_car');
            
            if (localStorage.getItem('driver_online') === 'true') {
                setOnlineUI();
                startTracking();
            }
        });

        ymaps.ready(initMap);

        function initMap() {
            map = new ymaps.Map("driverMap", {
                center: driverCoords,
                zoom: 16,
                controls: ['zoomControl']
            });

            driverMarker = new ymaps.Placemark(driverCoords, {
                hintContent: "Sizning mashinangiz",
                balloonContent: "Siz shu yerdasiz"
            }, {
                preset: 'islands#yellowTaxiIcon'
            });
            map.geoObjects.add(driverMarker);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    driverCoords = [pos.coords.latitude, pos.coords.longitude];
                    map.setCenter(driverCoords, 16);
                    driverMarker.geometry.setCoordinates(driverCoords);
                }, null, { enableHighAccuracy: true });
