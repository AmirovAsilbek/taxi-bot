<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Express Taxi - Admin Dispetcher</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ&coordorder=latlong&load=package.full" type="text/javascript"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: #0f1117; color: #f1f2f6; overflow-x: hidden; }

        .admin-header {
            background: #181b24; padding: 14px 18px; display: flex;
            align-items: center; justify-content: space-between;
            border-bottom: 1px solid #282c38; position: sticky; top: 0; z-index: 100;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .admin-badge {
            width: 38px; height: 38px; background: #ffcc00; color: #111;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 20px;
        }
        .header-title { font-size: 16px; font-weight: 800; color: #fff; }
        .header-sub { font-size: 11px; color: #8a8f9d; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 14px 16px; }
        .stat-card {
            background: #181b24; border: 1px solid #282c38; border-radius: 16px;
            padding: 14px; display: flex; flex-direction: column; gap: 4px;
        }
        .stat-num { font-size: 20px; font-weight: 900; color: #ffcc00; }
        .stat-title { font-size: 11px; font-weight: 700; color: #8a8f9d; text-transform: uppercase; }

        .tab-bar {
            display: flex; background: #181b24; margin: 0 16px 14px 16px;
            border-radius: 14px; padding: 4px; border: 1px solid #282c38; gap: 4px; overflow-x: auto;
        }
        .tab-btn {
            flex: 1; min-width: 75px; padding: 10px 4px; border: none;
            background: transparent; color: #8a8f9d; font-size: 11.5px;
            font-weight: 700; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap;
        }
        .tab-btn.active { background: #ffcc00; color: #111; }

        .tab-view { display: none; padding: 0 16px 30px 16px; }
        .tab-view.active { display: block; }

        #adminMap { width: 100%; height: 360px; border-radius: 20px; border: 1px solid #282c38; overflow: hidden; margin-bottom: 14px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { font-size: 15px; font-weight: 800; color: #fff; }

        .driver-card, .order-card {
            background: #181b24; border: 1px solid #282c38; border-radius: 18px;
            padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px;
        }
        .driver-top, .order-head { display: flex; align-items: center; justify-content: space-between; }
        .status-badge { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; }
        .status-badge.online { background: rgba(46, 213, 115, 0.15); color: #2ed573; }
        .status-badge.offline { background: rgba(255, 71, 87, 0.15); color: #ff4757; }
        .status-badge.pending { background: rgba(255, 165, 2, 0.15); color: #ffa502; }

        .driver-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-action-call {
            flex: 1;
            background: #282c38;
            color: #2ed573;
            text-align: center;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-action-delete {
            flex: 1;
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
            padding: 9px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }
        .btn-action-delete:active { background: rgba(255, 71, 87, 0.3); }

        .order-price { font-size: 18px; font-weight: 900; color: #ffcc00; }
        .order-badge { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 8px; }
        .order-badge.active { background: rgba(255, 204, 0, 0.15); color: #ffcc00; }

        .order-details { background: #13151c; padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
        .btn-cancel-adm { background: #ff4757; color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="admin-header">
        <div class="header-brand">
            <div class="admin-badge">Y</div>
            <div>
                <div class="header-title">Express Taxi Admin</div>
                <div class="header-sub">Dispetcherlik va Boshqaruv</div>
            </div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-num" id="statOnlineCount">0</div>
            <div class="stat-title">Online Haydovchilar</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="statActiveOrders">0</div>
            <div class="stat-title">Faol Buyurtmalar</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="statCompletedCount" style="color: #2ed573;">0</div>
            <div class="stat-title">Tugallangan Safarlar</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="statTotalDrivers">0</div>
            <div class="stat-title">Tasdiqlangan Haydovchilar</div>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('mapTab', this)">🗺️ Xarita</button>
        <button class="tab-btn" onclick="switchTab('ordersTab', this)">📦 Faol Buyurtmalar</button>
        <button class="tab-btn" onclick="switchTab('driversTab', this)">🚖 Haydovchilar</button>
        <button class="tab-btn" onclick="switchTab('applicationsTab', this)">
            📑 Arizalar <span id="pendingBadge" style="background:#ff4757; color:#fff; border-radius:10px; padding:1px 6px; font-size:10px; display:none;">0</span>
        </button>
    </div>

    <!-- 1. XARITA -->
    <div class="tab-view active" id="mapTab">
        <div id="adminMap"></div>
        <div class="section-title" style="margin-bottom: 8px;">🟢 Faol haydovchilar</div>
        <div id="mapDriversSummary" style="font-size: 13px; color: #8a8f9d;">Yuklanmoqda...</div>
    </div>

    <!-- 2. BARCHA FAOL BUYURTMALAR -->
    <div class="tab-view" id="ordersTab">
        <div class="section-header"><div class="section-title">Hozirgi barcha faol buyurtmalar</div></div>
        <div id="ordersListContainer">
            <div style="text-align: center; color: #8a8f9d; padding: 20px;">Hozircha faol buyurtmalar yo'q</div>
        </div>
    </div>

    <!-- 3. HAYDOVCHILAR -->
    <div class="tab-view" id="driversTab">
        <div class="section-header"><div class="section-title">Ro'yxatdan o'tgan haydovchilar</div></div>
        <div id="driversListContainer"></div>
    </div>

    <!-- 4. ARIZALAR -->
    <div class="tab-view" id="applicationsTab">
        <div class="section-header"><div class="section-title">Yangi kelib tushgan arizalar</div></div>
        <div id="applicationsListContainer"></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const firebaseConfig = { databaseURL: "https://express-taxi-83af2-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let adminMap;
        let driverMarkers = {};
        let registeredDriversData = {};
        let onlineDriversData = {};
        let activeOrdersData = {};

        const topViewCarSvg = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 64 64">
                <rect x="8" y="10" width="6" height="12" rx="3" fill="#111"/>
                <rect x="50" y="10" width="6" height="12" rx="3" fill="#111"/>
                <rect x="8" y="42" width="6" height="12" rx="3" fill="#111"/>
                <rect x="50" y="42" width="6" height="12" rx="3" fill="#111"/>
                <rect x="12" y="6" width="40" height="52" rx="14" fill="#ffcc00"/>
                <path d="M16 20 Q32 16 48 20 L45 28 Q32 26 19 28 Z" fill="#222" opacity="0.8"/>
                <rect x="18" y="27" width="28" height="18" rx="4" fill="#111"/>
            </svg>
        `);

        ymaps.ready(() => {
            adminMap = new ymaps.Map("adminMap", { center: [39.0560, 66.8300], zoom: 14, type: 'yandex#map', controls: ['zoomControl'] });
            initAdminSync();
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll(".tab-view").forEach(el => el.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
            document.getElementById(tabId).classList.add("active");
            btn.classList.add("active");
            if (tabId === 'mapTab' && adminMap) adminMap.container.fitToViewport();
        }

        function initAdminSync() {
            db.ref('registered_drivers').on('value', snap => {
                registeredDriversData = snap.val() || {};
                renderDriversList();
                renderApplicationsList();
                updateStats();
            });

            db.ref('drivers').on('value', snap => {
                onlineDriversData = snap.val() || {};
                updateMapMarkers(onlineDriversData);
                renderDriversList();
                updateStats();
            });

            db.ref('orders/active').on('value', snap => {
                activeOrdersData = snap.val() || {};
                renderActiveOrders();
                updateStats();
            });

            db.ref('order_history').on('value', snap => {
                const history = snap.val() || {};
                const count = Object.values(history).filter(h => h.status === 'completed').length;
                document.getElementById("statCompletedCount").innerText = count;
            });
        }

        function updateMapMarkers(drivers) {
            for (let id in driverMarkers) {
                if (!drivers[id] || !drivers[id].is_online) {
                    adminMap.geoObjects.remove(driverMarkers[id]);
                    delete driverMarkers[id];
                }
            }

            let summary = [];
            for (let id in drivers) {
                const d = drivers[id];
                if (d.is_online && d.lat && d.lon) {
                    summary.push(`🚖 ${d.name} (${d.car})`);
                    if (!driverMarkers[id]) {
                        const marker = new ymaps.Placemark([d.lat, d.lon], { hintContent: `${d.name} • ${d.car}` }, {
                            iconLayout: 'default#image',
                            iconImageHref: topViewCarSvg,
                            iconImageSize: [36, 36],
                            iconImageOffset: [-18, -18]
                        });
                        driverMarkers[id] = marker;
                        adminMap.geoObjects.add(marker);
                    } else {
                        driverMarkers[id].geometry.setCoordinates([d.lat, d.lon]);
                    }
                }
            }
            document.getElementById("mapDriversSummary").innerHTML = summary.length ? summary.join("<br>") : "Online haydovchilar yo'q";
        }

        function renderActiveOrders() {
            const container = document.getElementById("ordersListContainer");
            const keys = Object.keys(activeOrdersData);

            if (keys.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#8a8f9d; padding:20px;">Hozircha faol buyurtmalar yo'q</div>`;
                return;
            }

            container.innerHTML = "";
            keys.forEach(k => {
                const o = activeOrdersData[k];
                const card = document.createElement("div");
                card.className = "order-card";
                card.innerHTML = `
                    <div class="order-head">
                        <div>
                            <span style="font-size:12px; color:#ffcc00; font-weight:800;">#${o.order_id}</span>
                            <div class="order-price">${o.price || '0 UZS'}</div>
                        </div>
                        <span class="order-badge active">${(o.status || 'KUTILMOQDA').toUpperCase()}</span>
                    </div>
                    <div class="order-details">
                        <div>👤 <b>Mijoz:</b> ${o.client_name || 'Noma\'lum'} (${o.client_phone || ''})</div>
                        <div>📍 <b>Borish joyi:</b> ${o.destination || 'Belgilanmagan'}</div>
                        <div>🚗 <b>Haydovchi:</b> ${o.driver_name ? `${o.driver_name} (${o.driver_car})` : 'Qidirilmoqda...'}</div>
                    </div>
                    <button class="btn-cancel-adm" onclick="cancelOrderByAdmin('${k}')">❌ Bekor qilish</button>
                `;
                container.appendChild(card);
            });
        }

        function cancelOrderByAdmin(orderId) {
            if (confirm("Buyurtmani bekor qilmoqchimisiz?")) {
                db.ref('orders/active/' + orderId).update({
                    status: 'cancelled_by_admin',
                    cancel_reason: "Admin tomonidan bekor qilindi"
                });
                setTimeout(() => {
                    db.ref('orders/active/' + orderId).remove();
                }, 1000);
            }
        }

        function renderDriversList() {
            const container = document.getElementById("driversListContainer");
            const approved = Object.keys(registeredDriversData).filter(id => registeredDriversData[id].status === 'approved');

            if (approved.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#8a8f9d; padding:20px;">Tasdiqlangan haydovchilar yo'q</div>`;
                return;
            }

            container.innerHTML = "";
            approved.forEach(id => {
                const reg = registeredDriversData[id];
                const isOnline = onlineDriversData[id]?.is_online;
                const card = document.createElement("div");
                card.className = "driver-card";
                card.innerHTML = `
                    <div class="driver-top">
                        <div>
                            <div style="font-weight:800; color:#fff;">${reg.name}</div>
                            <div style="font-size:12px; color:#8a8f9d;">${reg.phone}</div>
                        </div>
                        <span class="status-badge ${isOnline ? 'online' : 'offline'}">${isOnline ? '● Online' : '○ Offline'}</span>
                    </div>
                    <div style="font-size:12px; color:#ccc;">🚗 ${reg.car} (${reg.plate}) • <b>${(reg.tariff || 'standart').toUpperCase()}</b></div>
                    <div class="driver-actions">
                        <a href="tel:${reg.phone}" class="btn-action-call">📞 Qo'ng'iroq</a>
                        <button class="btn-action-delete" onclick="deleteDriver('${id}', '${reg.name}')">🗑️ O'chirish</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderApplicationsList() {
            const container = document.getElementById("applicationsListContainer");
            const pending = Object.keys(registeredDriversData).filter(id => registeredDriversData[id].status === 'pending');
            const badge = document.getElementById("pendingBadge");

            if (pending.length > 0) {
                badge.innerText = pending.length;
                badge.style.display = "inline-block";
            } else {
                badge.style.display = "none";
            }

            if (pending.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#8a8f9d; padding:20px;">Yangi arizalar yo'q</div>`;
                return;
            }

            container.innerHTML = "";
            pending.forEach(id => {
                const reg = registeredDriversData[id];
                const card = document.createElement("div");
                card.className = "driver-card";
                card.innerHTML = `
                    <div class="driver-top">
                        <div>
                            <div style="font-weight:800; color:#fff;">${reg.name}</div>
                            <div style="font-size:12px; color:#8a8f9d;">${reg.phone}</div>
                        </div>
                        <span class="status-badge pending">Kutilmoqda</span>
                    </div>
                    <div style="font-size:12px; color:#ccc;">🚗 ${reg.car} (${reg.plate}) • <b>${(reg.tariff || 'standart').toUpperCase()}</b></div>
                    <div style="display:flex; gap:8px; margin-top:6px;">
                        <button style="flex:1; background:#2ed573; border:none; padding:8px; border-radius:8px; color:#fff; font-weight:800; cursor:pointer;" onclick="setDriverStatus('${id}', 'approved')">✅ Tasdiqlash</button>
                        <button style="flex:1; background:#ff4757; border:none; padding:8px; border-radius:8px; color:#fff; font-weight:800; cursor:pointer;" onclick="deleteDriver('${id}', '${reg.name}')">🗑️ O'chirish</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setDriverStatus(id, status) {
            db.ref('registered_drivers/' + id).update({ status, reviewed_at: Date.now() });
        }

        function deleteDriver(id, name) {
            if (confirm(`Haqiqatan ham "${name}" haydovchisini bazadan butunlay o'chirmoqchimisiz?`)) {
                db.ref('registered_drivers/' + id).remove();
                db.ref('drivers/' + id).remove();

                if (driverMarkers[id]) {
                    try { adminMap.geoObjects.remove(driverMarkers[id]); } catch(e){}
                    delete driverMarkers[id];
                }

                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                alert(`✅ "${name}" bazadan butunlay o'chirildi!`);
            }
        }

        function updateStats() {
            document.getElementById("statOnlineCount").innerText = Object.values(onlineDriversData).filter(d => d.is_online).length;
            document.getElementById("statActiveOrders").innerText = Object.keys(activeOrdersData).length;
            document.getElementById("statTotalDrivers").innerText = Object.values(registeredDriversData).filter(d => d.status === 'approved').length;
        }
    </script>
</body>
</html>
